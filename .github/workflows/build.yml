
name: Build and Download CANS BUK Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Prepare website files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify website files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "Website files verified successfully."

      - name: Package website
        run: |
          mkdir -p dist
          cp index.html style.css script.js logo.png flyer.jpg dist/
          echo "Website package created."

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: cans-buk-website
          path: dist/
          if-no-files-found: error
          retention-days: 7

  download:
    name: Download website artifact
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download a Build Artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: cans-buk-website
          path: ./downloaded-website

      - name: Verify downloaded website
        run: |
          ls -la ./downloaded-website
          test -f ./downloaded-website/index.html
          echo "Artifact downloaded successfully."
